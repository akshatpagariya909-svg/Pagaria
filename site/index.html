<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discover Architecture</title>
<meta name="description" content="A wall of 1,000 buildings for architecture students: wander, find precedents by idea, follow links to drawings and articles, and find the books to read.">
<link rel="canonical" href="https://akshatpagariya909-svg.github.io/Pagaria/">
<meta property="og:site_name" content="Discover Architecture">
<meta property="og:type" content="website">
<meta property="og:title" content="Discover Architecture">
<meta property="og:description" content="A wall of 1,000 buildings for architecture students: wander, find precedents by idea, and follow links to drawings and articles.">
<meta property="og:url" content="https://akshatpagariya909-svg.github.io/Pagaria/">
<meta property="og:image" content="https://akshatpagariya909-svg.github.io/Pagaria/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=a9fb229a">
<!--
  Analytics (free): create a site at https://www.goatcounter.com, then uncomment
  and replace YOURCODE. No cookies, no consent banner needed.
  <script data-goatcounter="https://YOURCODE.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

</head>
<body>
<header class="bar">
  <a class="mark" href="#" id="home">Discover<br><span class="accent">Architecture.</span></a>
  <div class="bar-mid">
    <div class="mode" role="group" aria-label="Buildings or books">
      <button type="button" id="modeBuildings" aria-pressed="true">Buildings</button>
      <button type="button" id="modeBooks" aria-pressed="false">Books</button>
    </div>
    <label class="search">
      <span class="sr">Search buildings, architects, cities or ideas</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search a building, architect, city or idea…" autocomplete="off">
    </label>
    <button type="button" class="btn ghost" id="filterBtn" aria-expanded="false" aria-controls="filters">Filter <span id="filterCount"></span></button>
  </div>
  <div class="bar-end">
    <span class="count" id="count">100 buildings</span>
    <a class="btn ghost" href="buildings/" id="allLink">All buildings</a>
  </div>
</header>
<nav class="ideas" id="ideas" aria-label="Browse by idea"><div class="mode-slot" id="modeSlot"></div><div class="ideas-list" id="ideasList"></div></nav>

<div class="filters" id="filters" hidden><div class="fp" id="fp" role="dialog" aria-modal="true" aria-label="Filters"></div></div>

<main class="feed" id="feed" aria-label="Buildings">
  <div class="cols" id="cols"></div>
  <p class="more" id="more" hidden>Loading more buildings…</p>
  <p class="empty" id="empty" hidden>Nothing matches. <button type="button" id="emptyClear">Clear the search</button></p>
</main>

<div class="sheet" id="sheet" hidden>
  <button type="button" class="veil" id="veil" aria-label="Close"></button>
  <article class="card" role="dialog" aria-modal="true" aria-labelledby="bName" tabindex="-1" id="card">
    <div class="gallery" id="gallery">
      <figure class="stage" id="stage"></figure>
      <button type="button" class="nav prev" id="gPrev" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="nav next" id="gNext" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="gcap" id="gCap"></div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="info">
      <div class="info-top">
        <span class="kicker" id="bKicker"></span>
        <button type="button" class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
      <h1 id="bName"></h1>
      <div class="whowhere">
        <div class="byline" id="byline"></div>
        <a class="where" id="where" target="_blank" rel="noopener"></a>
      </div>
      <p class="meta" id="bMeta"></p>
      <p class="study" id="bStudy"></p>
      <section>
        <h2 id="linksTitle">Go deeper</h2>
        <div class="links" id="links"></div>
        <p class="hint" id="shopNote" hidden>Shop links may earn this site a small commission. The price is the same for you.</p>
      </section>
      <a class="page-link" id="pageLink" href="#">Open the full page →</a>
      <section id="byArch">
        <h2><span id="byArchTitle"></span><button type="button" class="all" id="byArchAll"></button></h2>
        <div class="rel" id="byArchRel"></div>
      </section>
      <section id="sameType">
        <h2><span id="sameTypeTitle"></span><button type="button" class="all" id="sameTypeAll"></button></h2>
        <div class="rel" id="sameTypeRel"></div>
      </section>
      <section>
        <h2>Find more with</h2>
        <div class="chips" id="bChips"></div>
        <p class="hint" id="chipsHint">Each opens every building that shares the idea.</p>
      </section>
    </div>
  </article>
  <nav class="step" id="step" aria-label="Other buildings on the wall">
    <button type="button" class="step-btn prev" id="sPrev"><span class="arrow"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span><span class="peek"><img alt=""><small>Previous</small><b></b></span></button>
    <span class="step-pos" id="sPos"></span>
    <button type="button" class="step-btn next" id="sNext"><span class="arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span><span class="peek"><img alt=""><small>Next</small><b></b></span></button>
  </nav>
</div>

<nav class="dock" aria-label="Browse">
  <button type="button" class="back" id="goBack" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" id="shuffle">Shuffle</button>
  <button type="button" id="goHome" hidden>Home</button>
  <button type="button" class="go" id="surprise">Surprise me</button>
</nav>

<script src="data/buildings.js?v=1bfca465"></script>
<script src="data/links.js?v=f72157c9"></script>
<script src="data/architects.js?v=046f0729"></script>
<script src="data/filters.js?v=9e9876ee"></script>
<script src="data/world.js?v=5709bcc2"></script>
<script src="data/books.js?v=9acaeb87"></script>
<script src="app.js?v=68fc389a"></script>
<script src="filter.js?v=eeaf93fd"></script>
</body>
</html>
