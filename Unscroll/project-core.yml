name: Unscroll

options:
  bundleIdPrefix: com.akshat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Set by scripts/setup.sh (export DEVELOPMENT_TEAM=XXXXXXXXXX before xcodegen).
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    # Every bundle ID and the App Group derive from this one value.
    UNSCROLL_BUNDLE_ID: com.akshat.unscroll
    UNSCROLL_APP_GROUP: group.$(UNSCROLL_BUNDLE_ID)
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Unscroll:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: SharedActivity
      - path: SharedScreenTime
    info:
      path: Generated/Unscroll-Info.plist
      properties:
        CFBundleDisplayName: Unscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UnscrollAppGroup: $(UNSCROLL_APP_GROUP)
    entitlements:
      path: Generated/Unscroll.entitlements
      properties:
        com.apple.security.application-groups:
          - $(UNSCROLL_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UNSCROLL_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: UnscrollWidgets
    scheme:
      gatherCoverageData: false

  UnscrollWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: SharedActivity
    info:
      path: Generated/UnscrollWidgets-Info.plist
      properties:
        CFBundleDisplayName: Unscroll Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UnscrollAppGroup: $(UNSCROLL_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/UnscrollWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(UNSCROLL_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UNSCROLL_BUNDLE_ID).widgets
        APPLICATION_EXTENSION_API_ONLY: YES
