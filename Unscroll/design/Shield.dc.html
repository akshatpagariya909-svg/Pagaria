<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unscroll — Shield</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#C2471F}a:hover{color:#8F3215}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #CDB79B; color: #221B16; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif">
  <div style="position: absolute; left: -80px; top: 80px; width: 340px; height: 340px; border-radius: 50%; background: #B3542C; filter: blur(60px)"></div>
  <div style="position: absolute; right: -90px; top: 360px; width: 300px; height: 300px; border-radius: 50%; background: #6F7F4F; filter: blur(60px)"></div>
  <div style="position: absolute; left: 40px; bottom: -80px; width: 280px; height: 280px; border-radius: 50%; background: #E2B48B; filter: blur(60px)"></div>

  <div style="position: absolute; inset: 0; padding: 120px 20px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="border-radius: 36px; background: rgba(251,246,238,0.6); backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 24px 50px rgba(60,35,15,0.22); padding: 32px 28px 28px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #5B4F44">Visit today</span>
      <span style="font-size: 132px; font-weight: 800; line-height: 0.85; letter-spacing: -0.06em; color: #C2471F">{{visit}}</span>
      <span style="font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; text-wrap: pretty">{{line}}</span>
      <span style="font-size: 15px; line-height: 1.45; color: #4A3F36">1 h 48 m here today. Yesterday by now: 1 h 05 m.</span>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
        <button type="button" style="height: 54px; border: 0; border-radius: 27px; background: #221B16; color: #FBF7F0; font: inherit; font-size: 17px; font-weight: 700">Close the app</button>
        <button type="button" style="height: 48px; border: 1px solid rgba(34,27,22,0.25); border-radius: 24px; background: rgba(255,255,255,0.35); color: #221B16; font: inherit; font-size: 15px; font-weight: 600">5 more minutes · 2 passes left</button>
      </div>
    </div>
    <div style="margin-top: auto; align-self: center; display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-radius: 999px; background: rgba(251,246,238,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.7)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#221B16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v10"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
      <span style="font-size: 13px; font-weight: 600">Swap: drink a glass of water</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"visit":{"editor":"int","default":25,"min":1,"max":99},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visit ?? 25;
    const lines = [
      'Welcome back. We’re basically roommates now.',
      'Oh hey. Didn’t expect you. (I did.)',
      'Same app, same feed, new you? Let’s see.',
      'I saved your seat. You could also not sit.',
      'Back so soon? The reels missed you less.'
    ];
    return { visit: v, line: lines[v % lines.length] };
  }
}
</script>
</body>
</html>
