# Runs a tool for the architect write-ups on GitHub's servers (open internet) and commits what it writes.
# Trigger: change tools/architect_bios/request.txt on this branch. Its first line is the command, for example
#   python -u tools/fetch_architect_sources.py --ranks 1-10
name: Architect bios tool
on:
  push:
    branches: ['claude/architect-bios']
    paths: ['tools/architect_bios/request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: architect-bios
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: |
          CMD=$(head -n1 tools/architect_bios/request.txt)
          case "$CMD" in "python -u tools/fetch_architect_sources.py"*|"python -u tools/check_overview_links.py"*) ;; *) echo "Refusing: $CMD"; exit 1;; esac
          $CMD
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/architect_bios
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Architect bios tool: $(head -n1 tools/architect_bios/request.txt | cut -c1-60)"
          git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }
          git push
