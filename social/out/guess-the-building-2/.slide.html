* { box-sizing:border-box; margin:0; }
html,body { width:1080px; height:1350px; overflow:hidden; }

.label { font:500 17px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--graphite); margin-top:30px; }
