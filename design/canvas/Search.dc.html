<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dérive — search and filter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D3BF0}a:hover{color:#1A24B8}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #EDEDE9; color: #111110; font-family: 'Archivo', sans-serif; display: grid; grid-template-columns: 440px 1fr">
  <aside style="background: #F7F7F5; border-right: 1px solid #CFCDC6; padding: 20px 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: 8px 0 30px rgba(0,0,0,0.06); z-index: 2">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 26px; font-weight: 850; font-stretch: 125%; letter-spacing: -0.04em">Dérive</span>
      <a href="Home.dc.html" aria-label="Close search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="2"><path d="M5 5l14 14M19 5 5 19"/></svg></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="q" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #5D5C57">SEARCH 100 BUILDINGS</label>
      <div style="display: flex; align-items: center; border-bottom: 2px solid #111110">
        <input id="q" value="brick" style="all: unset; flex-grow: 1; font-size: 30px; font-weight: 800; font-stretch: 115%; padding: 6px 0 8px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5D5C57">ESC</span>

      <div style="display: flex; flex-direction: column; padding-top: 4px">
        <a href="#" style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px; background: #111110; color: #EDEDE9; text-decoration: none"><span style="font-weight: 700; font-size: 15px">Brick</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8E95FF">MATERIAL · 10</span></a>
        <a href="#" style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px; color: #111110; text-decoration: none; border-bottom: 1px solid #E2E1DC"><span style="font-size: 15px"><b>Brick</b> towers bending round a bullring</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #5D5C57">BUILDING</span></a>
        <a href="#" style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px; color: #111110; text-decoration: none; border-bottom: 1px solid #E2E1DC"><span style="font-size: 15px">Laurie Baker, the <b>brick</b> poet of Kerala</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #5D5C57">ARCHITECT</span></a>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #5D5C57; border-top: 1px solid #CFCDC6; padding-top: 14px">OR NARROW THE WALL</div>
    <sc-for list="{{facets}}" as="f" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 7px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em">{{f.name}}</span>
        <div style="display: flex; flex-wrap: wrap; gap: 4px">
          <sc-for list="{{f.opts}}" as="o" hint-placeholder-count="5">
            <button type="button" style="all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 6px 9px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #111110; padding-top: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px"><b>10</b> OF 100</span>
      <div style="display: flex; gap: 8px">
        <button type="button" style="all: unset; cursor: pointer; padding: 12px 14px; font-size: 14px; font-weight: 600; border-bottom: 1.5px solid #111110">Clear</button>
        <button type="button" style="all: unset; cursor: pointer; padding: 12px 18px; font-size: 14px; font-weight: 600; background: #2D3BF0; color: #fff">Show 10 on the wall</button>
      </div>
    </div>
  </aside>

  <main style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px; min-width: 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="display: flex; align-items: baseline; gap: 14px">
        <span style="font-weight: 850; font-stretch: 125%; font-size: 30px; letter-spacing: -0.02em">BRICK</span>
        <span style="font-family: 'Newsreader', serif; font-style: italic; font-size: 20px; color: #3E3D39">fired, sun-dried, salvaged, perforated</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5D5C57">THE WALL REARRANGES · MATCHES FIRST</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(4, 112px); gap: 6px">
      <sc-for list="{{hits}}" as="h" hint-placeholder-count="10">
        <div style="grid-column: span {{h.w}}; grid-row: span {{h.h}}; position: relative; overflow: hidden">
          <img src="{{h.img}}" alt="{{h.name}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
          <div style="position: absolute; left: 0; bottom: 0; background: #111110; color: #EDEDE9; padding: 5px 8px 6px; font-size: 12px; font-weight: 700">{{h.name}}</div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #5D5C57; padding-top: 6px"><span>90 OTHERS, STILL HERE</span><span style="flex-grow: 1; height: 1px; background: #CFCDC6"></span></div>
    <div style="display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="90">
        <img src="{{g}}" alt="" style="width: 100%; aspect-ratio: 1; object-fit: cover; display: block; opacity: 0.22; filter: grayscale(1)">
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
